name: Render video
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools and Bengali fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-freefont-ttf
          pip install playwright
          playwright install --with-deps chromium
      - name: Render video
        run: python render.py voice.mp3 river_crossing_9x16.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: river-crossing-video
          path: river_crossing_9x16.mp4
